version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: epl_analyst_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/epl_analyst.db
      - DATA_DIR=/app/data
      - MODELS_DIR=/app/models
      - MAX_UPLOAD_SIZE_MB=2048
      - DEFAULT_SAMPLE_FPS=5
      - CORS_ORIGINS=http://localhost:5173
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: epl_analyst_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  data:
